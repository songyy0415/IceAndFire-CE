plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.10' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        // Local 26.2 builds of uranus (and any other locally-published dependency).
        mavenLocal()
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = 'https://maven.ladysnake.org/releases' }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.theillusivec4.top/" }
        maven { url = "https://cursemaven.com" }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://maven.nucleoid.xyz/' }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://modmaven.dev" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
        maven { url = "https://maven.createmod.net" }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }

    dependencies {
        // MC 26.2 ships official (mojmap) class names directly — no separate
        // mappings artifact exists, so loom-no-remap mode needs no `mappings` line.
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        // Raise javac's default 100-error reporting cap so migration error counts are accurate.
        it.options.compilerArgs += ['-Xmaxerrs', '5000']
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

tasks.register('copyJars', Copy) {
    from('fabric/build/libs') {
        include "${rootProject.archives_name}-fabric-${rootProject.mod_version}.jar"
        rename { String fileName ->
            "${rootProject.archives_name}-${rootProject.mod_version}-${rootProject.minecraft_version}-fabric.jar"
        }
    }
    into 'build/libs'
}
