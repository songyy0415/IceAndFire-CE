plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    // Inject the common access widener into the fabric jar as `iceandfire.accesswidener`
    // (referenced by fabric.mod.json), since loom-no-remap has no separate remap step.
    injectAccessWidener(tasks.named('jar'))
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Dependencies in this configuration are copied VERBATIM (as .jar blobs) into
    // META-INF/jars/ of the production jar, and each one must be declared in
    // fabric.mod.json's "jars" list. FabricLoader loads them as separate mods — their
    // own fabric.mod.json, mixins and accessWidener all apply. This is the loom-no-remap
    // equivalent of the old `include("...")`.
    // Only integration-fabric is nested here (its jar already contains the integration-common
    // classes). architectury-fabric stays a plain dependency, installed separately in
    // production, matching the pre-26.2 behaviour.
    nestedJars {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // loom-no-remap (MC 26.2) has no `modImplementation` config — plain `api`/`implementation` is used.
    api "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    api "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. Compiled against for dev/runtime; installed separately in production.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // uranus 26.2 (2.4.1-bugfix) — local build, installed to mavenLocal.
    implementation "com.iafenvoy.uranus:uranus-fabric:2.4.1-bugfix"
    // jupiter 26.2 local port (Jupiter new, 2.4.2) to be wired in P3; 1.21.1 kept for P1.
    implementation "maven.modrinth:jupiter:5pNXzmee"

    // Bundled into META-INF/jars/ (integration-fabric jar already contains common classes).
    implementation "com.github.IAFEnvoy.Integration:integration-fabric:$integration_version"
    nestedJars "com.github.IAFEnvoy.Integration:integration-fabric:$integration_version"

    // Optional dependencies
    // ModMenu
    api "com.terraformersmc:modmenu:${modmenu_version}"

    // EMI (dev runtime only) — 26.2 local port (D:/aiminecraftdev/emi26.2) → mavenLocal.
    runtimeOnly "dev.emi:emi-fabric:${emi_version}"

    // Jade
    implementation "maven.modrinth:jade:JB4B8a9g"

    // Trinkets (Patbox "Trinkets Updated", eu.pb4.trinkets) — 26.2 build.
    api "maven.modrinth:trinkets-updated:to3SIE4i"
    api "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    api "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

    // [P1 待确认] No Ponder-Fabric-26.2 artifact exists yet — disabled until a 26.2 coordinate is available.
    // compileOnly "net.createmod.ponder:Ponder-Fabric-${minecraft_version}:${ponder_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    // The access widener and mixin config live in the common module's resources.
    // Loom's dev launcher requires files referenced by fabric.mod.json (accessWidener,
    // mixins) to be inside the mod's own files (fabric/build/resources/main), not the
    // common jar on the classpath — copy them so both dev runs and the production jar
    // resolve them. Single source of truth stays in :common.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':common').file('src/main/resources/iceandfire.accesswidener'))
    from(project(':common').file('src/main/resources/iceandfire.mixins.json'))
}

jar {
    // loom-no-remap has no remapJar; this standard Jar task IS the final artifact.
    // (Shadow's shadowJar can't be used here: its from(zipTree) recursively re-expands
    // any nested .jar entry, so a bundled mod jar would be torn apart and its classes
    // dumped into the jar root. A plain Gradle Jar keeps a .jar source as a blob.)
    archiveClassifier = null

    // Merge the common module's transformed classes/resources into the final jar.
    // shadowBundle holds exactly project(':common', transformProductionFabric).
    from(zipTree(project.configurations.shadowBundle.singleFile)) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // integration-fabric as a nested mod jar, verbatim, under META-INF/jars.
    // Standard Gradle Jar semantics keep a .jar source as a single blob entry rather
    // than expanding it. Renamed to a stable name so fabric.mod.json's "jars" path
    // doesn't track the integration version.
    from(project.configurations.nestedJars) {
        into 'META-INF/jars'
        rename { it.replaceFirst(/integration-fabric-.*\.jar$/, 'integration-fabric.jar') }
    }

    zip64 = true
}

assemble.dependsOn jar
